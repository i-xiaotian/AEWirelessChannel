plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.192'
    id 'eclipse'
    id 'maven-publish'
}

group = 'com.xiaotian.ae.wirelesscable'
version = '1.3.0+mc1.21.1'
base.archivesName = 'AEWirelessChannel'

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

runs {
    configureEach {
        workingDirectory project.file('run')
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }

    client {}
    server {}
}

repositories {
    mavenCentral()
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    implementation 'net.neoforged:neoforge:21.1.258'
    implementation 'maven.modrinth:ae2:19.2.18'
    implementation 'maven.modrinth:guideme:21.1.19'
    implementation 'maven.modrinth:jade:15.10.6+neoforge'
    implementation 'maven.modrinth:the-one-probe:1.21_neo-12.0.8'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/neoforge.mods.toml') {
        expand version: project.version
    }
}

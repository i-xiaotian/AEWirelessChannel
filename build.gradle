plugins {
    id 'net.minecraftforge.gradle' version '[6.0,6.2)'
    id 'eclipse'
    id 'maven-publish'
}

group = 'com.xiaotian.ae.wirelesscable'
version = '1.1.0+mc1.20.1'
base.archivesName = 'AEWirelessChannel'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

minecraft {
    mappings channel: 'official', version: '1.20.1'

    runs {
        configureEach {
            workingDirectory project.file('run')
            property 'forge.logging.markers', 'REGISTRIES'
            property 'forge.logging.console.level', 'info'
            property 'mixin.env.remapRefMap', 'true'
            property 'mixin.env.refMapRemappingFile', "${buildDir}/createSrgToMcp/output.srg"

            mods {
                aewirelesschannel {
                    source sourceSets.main
                }
            }
        }

        client {}
        server {}
    }
}

tasks.matching { it.name in ['runClient', 'runServer'] }.configureEach {
    dependsOn 'createSrgToMcp'
}

repositories {
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    minecraft 'net.minecraftforge:forge:1.20.1-47.3.0'
    implementation fg.deobf('appeng:appliedenergistics2-forge:15.4.11')
    implementation fg.deobf('maven.modrinth:guideme:20.1.7')
    implementation fg.deobf('maven.modrinth:the-one-probe:1.20.1-10.0.4')
    implementation fg.deobf('maven.modrinth:jade:11.13.3+forge')
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}

plugins {
    id 'net.neoforged.gradle.userdev' version '7.0.192'
    id 'eclipse'
    id 'maven-publish'
}

group = 'com.xiaotian.ae.wirelesscable'
version = '1.1.0+mc1.20.2'
base.archivesName = 'AEWirelessChannel'

java.toolchain.languageVersion = JavaLanguageVersion.of(17)

runs {
    configureEach {
        workingDirectory project.file('run')
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'info'
        modSource project.sourceSets.main
    }

    client {}
    server {}
}

repositories {
    maven { url = 'https://modmaven.dev' }
    maven { url = 'https://api.modrinth.com/maven' }
}

dependencies {
    implementation 'net.neoforged:neoforge:20.2.93'
    implementation 'appeng:appliedenergistics2-neoforge:16.0.2'
    implementation 'maven.modrinth:jade:12.4.0'
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}

processResources {
    inputs.property 'version', project.version
    filesMatching('META-INF/mods.toml') {
        expand version: project.version
    }
}
